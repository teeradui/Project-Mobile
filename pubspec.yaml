name: mobile_project
description: "Smart Kitchen Assistant - A production-ready Flutter app with voice and AI integration."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # State Management
  provider: ^6.1.2

  # Voice & Permissions
  speech_to_text: ^7.3.0
  permission_handler: ^11.3.1

  # Network & AI
  http: ^1.2.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
